[project]
name = "avr26-bmle-mlops-anomaliesreseau"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
