[project]
name = "anomalies-reseau"
version = "0.1.0"
description = "Détection d'anomalies sur le réseau électrique français (éCO2mix) — pipeline MLOps"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.44",
    "pyarrow>=17",
    "duckdb>=1.5",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "holidays>=0.100",
    "vacances-scolaires-france>=0.3",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "statsforecast>=1.7",
    "uvicorn>=0.52",
    "fastapi>=0.141",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "flake8>=7"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
