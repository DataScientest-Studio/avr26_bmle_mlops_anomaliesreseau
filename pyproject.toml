[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "flake8>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F : erreurs et bugs · I : tri des imports · UP : modernisation Python
# B : pièges courants (bugbear) · SIM : simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
avr26-bmle-mlops-anomaliesreseau = { workspace = true }
