name: eco2mix

services:

  db:
    image: postgres:16.4
    container_name: eco2mix_db
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mlops-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./src/models/Dockerfile
    container_name: anomaliesreseau_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=db
      # L'API logue les entraînements et sert le modèle champion depuis MLflow.
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI} #http://mlflow:5000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/verify').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    networks:
      - mlops-net
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: ./docker/mlflow/Dockerfile
    image: eco2mix/mlflow:latest
    container_name: eco2mix_mlflow
    environment:
      # Rôle `mlflow`, propriétaire de sa seule base (créé par make db-meta).
      # Passé en variable plutôt qu'en argument de command : un argument de
      # ligne de commande est lisible dans un `ps` à l'intérieur du conteneur.
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD}@db:5432/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
        --artifacts-destination /mlartifacts --serve-artifacts
    ports:
      # Port interne 5000 sur le réseau Compose ; MLFLOW_PORT (5001 sur macOS,
      # où AirPlay occupe le 5000) ne concerne que l'accès navigateur.
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlartifacts:/mlartifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mlops-net
    restart: unless-stopped

  # --- Stockage objet S3 pour les artefacts MLflow -----------------------
  # Silo : fork maintenu de MinIO. L'image amont minio/minio a été retirée
  # de Docker Hub le 11/09/2026 et les versions figées ne sont plus patchées.
  # `latest` pour recevoir les correctifs : mise à jour via `make silo-update`,
  # Compose ne retélécharge jamais une image déjà présente.
  silo:
    image: pgsty/silo:latest
    command: ["server", "/data", "--console-address", ":9001"]
    # Variables explicites plutôt que env_file : Silo ne reçoit que ses
    # propres identifiants, pas les secrets Postgres ou Airflow.
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_local=http://$${MINIO_ROOT_USER}:$${MINIO_ROOT_PASSWORD}@localhost:9000 mcli ready local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      # Console web seulement, et seulement depuis la machine locale.
      # L'API S3 (9000) reste interne au réseau Docker : seul MLflow y accède.
      - "127.0.0.1:9001:9001"
    volumes:
      - silodata:/data
    networks:
      - mlops-net
    restart: unless-stopped

  # Conteneur éphémère : crée le bucket, la politique et l'utilisateur
  # applicatif, puis s'arrête. Idempotent, relancé à chaque `up`.
  silo-init:
    image: pgsty/silo:latest
    entrypoint: ["sh", "/init/init.sh"]
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
      SILO_MLFLOW_ACCESS_KEY: ${SILO_MLFLOW_ACCESS_KEY}
      SILO_MLFLOW_SECRET_KEY: ${SILO_MLFLOW_SECRET_KEY}
    volumes:
      - ./docker/silo:/init:ro
    depends_on:
      silo:
        condition: service_healthy
    networks:
      - mlops-net
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - mlops-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - mlops-net

networks:
  mlops-net:
    driver: bridge

volumes:
  pgdata:
  mlartifacts:
  prometheus_data:
  grafana_data:
  silodata:
