name: eco2mix

services:

  db:
    image: postgres:16.4
    container_name: eco2mix_db
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: 
      context: .
      dockerfile: ./src/models/Dockerfile
    container_name: anomaliesreseau_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=db
      # L'API logue les entraînements et sert le modèle champion depuis MLflow.
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    container_name: eco2mix_mlflow
    env_file: .env
    entrypoint: ["bash", "/start.sh"]
    volumes:
      - ./docker/mlflow/start.sh:/start.sh:ro
      - mlartifacts:/mlartifacts
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  mlartifacts: